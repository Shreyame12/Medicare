<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare - Medication Management</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1> MediCare </h1>
        <p>Intelligent Medication Adherence Monitoring System</p>
    </header>

    <nav>
        <a href="#">Dashboard</a>
        <a href="#">My Medicines</a>
        <a href="#">Dose History</a>
        <a href="#">Reports</a>
        <a href="#">Emergency Contacts</a>
    </nav>

    <main>
        <h2>Welcome to MediCare!</h2>
        <p>Manage your medicines and stay on track with your health.</p>

        <section class="dashboard">

            <div class="card">
                <h3>Total Medicines</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Today's Doses</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Doses Taken</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Missed Doses</h3>
                <p>0</p>
            </div>

        </section>

        <section class="medicines">
            <h2>My Medicines</h2>
            <button id="addMedicine">+ Add Medicine</button>
            <div id="medicineList"></div>
        </section>

    </main>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
